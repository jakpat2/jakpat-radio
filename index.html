<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Jakpat Radio Logo-circle.png">
    <title>Jakpat Radio</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.4);
            --bg-dark: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.035);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(255, 255, 255, 0.16);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --volume-percent: 80%;
            --progress-percent: 0%;
            --scroll-speed: 0.5s;
            --word-speed: 0.25s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        .ambient-bg {
            position: fixed;
            inset: -80px;
            background-image: url('Jakpat Radio Logo-circle.png');
            background-size: cover;
            background-position: center;
            filter: blur(120px) brightness(0.25) saturate(1.8);
            transform: scale(1.1);
            transition: background-image 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .ambient-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(10, 10, 15, 0.3) 0%, rgba(10, 10, 15, 0.92) 100%);
            z-index: 2;
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1280px;
            min-height: calc(100dvh - 40px);
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(18, 18, 26, 0.55);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 32px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--card-border);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.2);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 6px;
            transition: all 0.3s ease;
        }

        .live-badge.reconnecting {
            background: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border-color: rgba(255, 165, 0, 0.3);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
            animation: pulse-dot 1.8s infinite ease-in-out;
        }

        .live-badge.reconnecting .live-dot {
            background-color: #ffa500;
            box-shadow: 0 0 8px #ffa500;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .player-main {
            display: grid;
            grid-template-columns: 340px 1fr 380px;
            gap: 48px;
            align-items: center;
            width: 100%;
            margin: auto 0;
            padding: 24px 0;
        }

        .art-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 71, 87, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .art-card:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: var(--card-hover-border);
        }

        .art-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        .track-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .meta-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-title-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
            word-break: break-word;
            color: #ffffff;
        }

        .artist-name-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .album-name-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            width: 100%;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: var(--progress-percent);
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            border-radius: 12px;
            transition: width 0.25s linear;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
        }

        .controls-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 8px;
            width: 100%;
        }

        .play-btn-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn {
            background: #ffffff;
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn:hover {
            transform: scale(1.06);
            background: var(--primary);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .play-btn:hover svg { fill: #ffffff; }

        .play-btn svg {
            width: 22px;
            height: 22px;
            fill: #0a0a0f;
            transition: fill 0.2s ease;
            margin-left: 2px;
        }

        .play-btn.playing svg {
            margin-left: 0;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 30px;
            width: 180px;
        }

        .volume-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .volume-box svg {
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
            transition: fill 0.2s ease;
        }

        .volume-box:hover svg { fill: #ffffff; }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: linear-gradient(to right, var(--primary) 0%, var(--primary) var(--volume-percent), rgba(255, 255, 255, 0.12) var(--volume-percent), rgba(255, 255, 255, 0.12) 100%);
            border-radius: 10px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            margin-top: -4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .lyrics-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 20px;
            height: 380px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #lyrics-wrapper {
            width: 100%;
            transition: transform var(--scroll-speed) cubic-bezier(0.23, 1, 0.32, 1);
        }

        #lyrics {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        li.lyric-line {
            padding: 12px 8px;
            font-size: 1.35rem;
            line-height: 1.4;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0.18;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        li.lyric-line.active { opacity: 1 !important; transform: scale(1.02); }

        .word-wrapper { display: inline-block; perspective: 1000px; }

        .word {
            display: inline-block;
            transition: transform var(--word-speed) cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity var(--word-speed) ease,
                        color var(--word-speed) ease,
                        text-shadow var(--word-speed) ease;
            opacity: 0.45;
            white-space: pre;
            transform: translateY(0);
        }

        .active-word {
            opacity: 1 !important;
            color: #ffffff !important;
            transform: translateY(-2px);
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.8), 
                0 0 25px rgba(255, 71, 87, 0.4);
        }

        .status-msg {
            opacity: 0.6 !important;
            font-size: 1.05rem !important;
            margin-top: 145px;
            color: var(--text-sub);
            text-align: center;
            font-weight: 600;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        @media (max-width: 1100px) {
            .app-container { height: auto; padding: 28px; margin: 0 16px; }
            .player-main { grid-template-columns: 1fr; text-align: center; justify-items: center; gap: 28px; padding: 12px 0; }
            .track-section { align-items: center; }
            .meta-group { align-items: center; }
            .art-card { max-width: 260px; }
            .controls-box { justify-content: center; }
            .lyrics-card { width: 100%; height: 220px; }
            .status-msg { margin-top: 75px; }
            .footer { justify-content: center; }
        }

        @media (max-width: 480px) {
            body { padding: 0; }
            .app-container { border-radius: 0; border: none; min-height: 100dvh; padding: 20px 16px; margin: 0; }
            .song-title-text { font-size: 26px; }
            .artist-name-text { font-size: 17px; }
            .art-card { max-width: 220px; border-radius: 20px; }
            .controls-box { gap: 12px; }
            .volume-box { width: 140px; padding: 8px 12px; }
            li.lyric-line { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambient-bg"></div>
    <div class="ambient-overlay"></div>

    <div class="app-container">
        <audio id="radio-audio" crossorigin="anonymous"></audio>

        <header class="header">
            <div class="brand">
                <img src="Jakpat Radio Logo-circle.png" class="brand-logo" alt="Jakpat Logo" id="header-logo" onerror="this.onerror=null; this.src='Jakpat Radio Logo-circle.png';">
                <span class="brand-title">Jakpat Radio</span>
            </div>
        </header>

        <main class="player-main">
            <div class="art-card">
                <img id="album-art" src="Jakpat Radio Logo-circle.png" alt="Album Cover" onerror="this.onerror=null; this.src='Jakpat Radio Logo-circle.png';">
            </div>

            <div class="track-section">
                <div class="meta-group">
                    <div class="live-badge" id="live-badge">
                        <span class="live-dot"></span> <span id="live-status-text">LIVE</span>
                    </div>
                    <h1 class="song-title-text" id="song-title">Stream</h1>
                    <h2 class="artist-name-text" id="artist-name">Jakpat Radio</h2>
                    <h3 class="album-name-text" id="album-name">Connecting to stream...</h3>
                </div>

                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <div class="time-labels">
                        <span id="current-time">0:00</span>
                        <span id="total-duration">0:00</span>
                    </div>
                </div>

                <div class="controls-box">
                    <div class="play-btn-wrapper" id="play-wrapper">
                        <button class="play-btn" id="play-btn" title="Play Stream" aria-label="Play Stream">
                            <svg id="play-icon" viewBox="0 0 24 24">
                                <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                            </svg>
                        </button>
                    </div>

                    <div class="volume-box">
                        <button class="volume-icon-btn" id="volume-toggle" title="Mute/Unmute" aria-label="Mute/Unmute">
                            <svg id="volume-icon" viewBox="0 0 24 24">
                                <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                            </svg>
                        </button>
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume Slider">
                    </div>
                </div>
            </div>

            <div class="lyrics-card" id="lyrics-panel">
                <div id="lyrics-wrapper">
                    <ul id="lyrics">
                        <li class="status-msg">Loading track data...</li>
                    </ul>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div>&copy; Jakpat Radio</div>
        </footer>
    </div>

<script>
const streamUrl = 'https://stream-stream.jakpat.dev/radio/jakpat/index.m3u8';
const metadataUrl = 'https://radio-metadata.jakpat.dev/';
const LYRICS_HOST = "https://lrclib.net/api";
const defaultArtwork = 'Jakpat Radio Logo-circle.png';

const audio = document.getElementById('radio-audio');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const volumeSlider = document.getElementById('volume-slider');
const volumeToggle = document.getElementById('volume-toggle');
const albumArt = document.getElementById('album-art');
const ambientBg = document.getElementById('ambient-bg');
const songTitleElem = document.getElementById('song-title');
const artistNameElem = document.getElementById('artist-name');
const albumNameElem = document.getElementById('album-name');
const currentTimeElem = document.getElementById('current-time');
const totalDurationElem = document.getElementById('total-duration');
const liveBadge = document.getElementById('live-badge');
const liveStatusText = document.getElementById('live-status-text');

let hls = null;
let clockOffset = 0;
let metadataQueue = [];
let activeTrack = null;
let lastVolume = 0.8;
let lastFormattedTime = "";

let current_lyrics = [];
let current_line_index = -1;
let current_word_index = -1;

// Ultra-Responsive Auto-Healing State
let isReconnecting = false;
let reconnectTimer = null;
let shouldBePlaying = false;
let lastProgressTime = 0;
let stallCheckTimer = null;

// Background Overhead Control
let metadataInterval = null;

// Time Smoothing State
let smoothedLatency = 10.0;
let lastSongPos = 0;

function formatTime(secs) {
    if (!secs || isNaN(secs) || secs <= 0) return "0:00";
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function cleanString(str) {
    return (str || '')
        .toLowerCase()
        .replace(/\(feat.*?\)|\[.*?\]|\(official.*?\)/gi, '')
        .replace(/[^a-z0-9]/g, '')
        .trim();
}

function setStatus(msg) { 
    document.getElementById('lyrics-wrapper').style.transform = `translateY(0px)`;
    document.getElementById("lyrics").innerHTML = `<li class='status-msg'>${msg}</li>`; 
}

function startMetadataPolling() {
    if (!metadataInterval && !document.hidden && !audio.paused) {
        fetchMetadata();
        metadataInterval = setInterval(fetchMetadata, 1500);
    }
}

function stopMetadataPolling() {
    if (metadataInterval) {
        clearInterval(metadataInterval);
        metadataInterval = null;
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden || audio.paused) {
        stopMetadataPolling();
    } else {
        startMetadataPolling();
    }
});

function initMediaSession() {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', togglePlay);
        navigator.mediaSession.setActionHandler('pause', togglePlay);
    }
}

function updateMediaSession(title, artist, album, artUrl) {
    if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: title,
            artist: artist,
            album: album || 'Jakpat Radio',
            artwork: [
                { src: artUrl || defaultArtwork, sizes: '512x512', type: 'image/png' }
            ]
        });
    }
}

async function resolveArtwork(artist, title, metadataCover) {
    if (metadataCover && metadataCover !== 'null' && metadataCover !== '') {
        return metadataCover;
    }

    const targetArtist = cleanString(artist);
    const targetTitle = cleanString(title);
    const queryStr = `${artist} ${title}`;

    // Step 1: Try Apple Music (iTunes API)
    try {
        const appleRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(queryStr)}&entity=song&limit=5`);
        if (appleRes.ok) {
            const data = await appleRes.json();
            const match = data.results.find(item => {
                const itemArtist = cleanString(item.artistName);
                const itemTitle = item.trackName ? cleanString(item.trackName) : '';
                return (itemArtist.includes(targetArtist) || targetArtist.includes(itemArtist)) &&
                       (itemTitle.includes(targetTitle) || targetTitle.includes(itemTitle));
            });

            if (match && match.artworkUrl100) {
                return match.artworkUrl100.replace('100x100bb', '600x600bb');
            }
        }
    } catch (e) {
        console.warn("Apple Music fetch failed, trying proxy fallback...", e);
    }

    // Step 2: Fallback to Deezer routed via a public CORS proxy
    try {
        const deezerUrl = `https://api.deezer.com/search?q=${encodeURIComponent(queryStr)}`;
        const proxyRes = await fetch(`https://corsproxy.io/?${encodeURIComponent(deezerUrl)}`);
        
        if (proxyRes.ok) {
            const data = await proxyRes.json();
            if (data && data.data && data.data.length > 0) {
                const match = data.data.find(item => {
                    const itemArtist = cleanString(item.artist?.name);
                    const itemTitle = cleanString(item.title);
                    return (itemArtist.includes(targetArtist) || targetArtist.includes(itemArtist)) &&
                           (itemTitle.includes(targetTitle) || targetTitle.includes(itemTitle));
                }) || data.data[0];

                if (match && match.album && match.album.cover_big) {
                    return match.album.cover_big;
                } else if (match && match.album && match.album.cover_medium) {
                    return match.album.cover_medium;
                }
            }
        }
    } catch (e) {
        console.warn("Deezer proxy fallback failed, using default image...", e);
    }

    // Step 3: Ultimate Fallback
    return defaultArtwork;
}

async function getLyrics(title, artist, duration) {
    setStatus("Searching lyrics...");

    const cleanTitle = title.replace(/\(feat.*?\)|\[.*?\]|\(Official.*?\)/gi, "").split('-')[0].trim();
    const cleanArtist = artist.replace(/- Topic/gi, "").trim();
    const roundedDuration = duration ? Math.round(duration) : null;

    if (roundedDuration) {
        try {
            const getUrl = `${LYRICS_HOST}/get?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(cleanArtist)}&duration=${roundedDuration}`;
            const response = await fetch(getUrl);
            if (response.ok) {
                const data = await response.json();
                if (data.syncedLyrics) {
                    renderLyrics(data.syncedLyrics);
                    return;
                }
            }
        } catch (e) {}
    }

    try {
        const searchUrl = `${LYRICS_HOST}/search?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(cleanArtist)}`;
        const response = await fetch(searchUrl);
        if (!response.ok) throw new Error("Lyrics fetch failed");

        const results = await response.json();
        const syncedResults = results.filter(r => r.syncedLyrics);

        let match = syncedResults.find(r => duration && Math.abs(r.duration - duration) < 4);

        if (!match && syncedResults.length > 0) {
            if (syncedResults[0].trackName.toLowerCase() === cleanTitle.toLowerCase()) {
                match = syncedResults[0];
            }
        }

        if (match) renderLyrics(match.syncedLyrics);
        else setStatus("Lyrics Not Available");
    } catch (e) {
        setStatus("Lyrics Not Available");
    }
}

function renderLyrics(syncedText) {
    const lines = syncedText.split("\n");
    current_lyrics = [];
    current_line_index = -1;
    current_word_index = -1;
    const timeRegex = /\[(\d+):(\d+)(?:[.:](\d+))?\]/;
    
    for (let line of lines) {
        const match = line.match(timeRegex);
        if (match) {
            const mins = parseInt(match[1]);
            const secs = parseInt(match[2]);
            const msStr = match[3] || "0";
            const ms = parseInt(msStr.padEnd(3, '0').substring(0, 3));
            const totalSeconds = mins * 60 + secs + (ms / 1000);
            
            const content = line.replace(/\[.*?\]/, "").trim();
            if (!content) continue; 
            
            const words = content.split(/\s+/).map(w => ({ text: w }));
            current_lyrics.push({ time: totalSeconds, words });
        }
    }
    
    current_lyrics.sort((a, b) => a.time - b.time);
    const lyricsEl = document.getElementById("lyrics");
    lyricsEl.innerHTML = "";
    
    current_lyrics.forEach((line, i) => {
        const li = document.createElement('li');
        li.className = 'lyric-line';
        li.id = `line-${i}`;
        line.words.forEach(w => {
            const wrapper = document.createElement('span');
            wrapper.className = 'word-wrapper';
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = w.text + " ";
            wrapper.appendChild(span);
            li.appendChild(wrapper);
        });
        lyricsEl.appendChild(li);
    });
}

function updateLyricsPosition(current_song_pos) {
    if (current_lyrics.length === 0) return;

    let targetIndex = -1;
    for (let i = 0; i < current_lyrics.length; i++) {
        if (current_song_pos >= current_lyrics[i].time) targetIndex = i;
        else break;
    }

    if (targetIndex !== -1 && targetIndex !== current_line_index) {
        const line = document.getElementById("line-" + targetIndex);
        const prev = document.getElementById("line-" + current_line_index);
        if (prev) { 
            prev.classList.remove("active"); 
            prev.querySelectorAll('.word').forEach(w => w.classList.remove('active-word')); 
        }
        if (line) {
            line.classList.add("active");
            const panel = document.getElementById('lyrics-panel');
            const offset = (panel.clientHeight / 2) - (line.offsetTop + line.offsetHeight / 2);
            document.getElementById('lyrics-wrapper').style.transform = `translateY(${offset}px)`;
        }
        current_line_index = targetIndex;
        current_word_index = -1;
    }

    if (targetIndex !== -1) {
        const lineData = current_lyrics[targetIndex];
        const nextLine = current_lyrics[targetIndex + 1];
        const lineStart = lineData.time;
        const lineEnd = nextLine ? nextLine.time : lineStart + 4;

        const rawLineDuration = Math.max(0.1, lineEnd - lineStart);
        const timeInLine = current_song_pos - lineStart;

        const naturalDuration = (lineData.words.length * 0.6) + 1.2;
        const activeSingingDuration = Math.min(rawLineDuration, naturalDuration);

        const totalChars = lineData.words.map(w => w.text).join('').length;
        const isHighDensity = (totalChars / activeSingingDuration) > 12; 

        let totalWeight = 0;
        const weights = lineData.words.map(w => {
            let weight = Math.max(2, w.text.length); 
            if (w.text.match(/[.,!?]$/) && !isHighDensity) weight += 4; 
            totalWeight += weight;
            return weight;
        });

        let activeWordIdx = -1;
        if (timeInLine >= activeSingingDuration) {
            activeWordIdx = lineData.words.length - 1;
        } else if (timeInLine >= 0) {
            let cumulativeTime = 0;
            for (let j = 0; j < lineData.words.length; j++) {
                const wordDuration = (weights[j] / totalWeight) * activeSingingDuration;
                if (timeInLine >= cumulativeTime) {
                    activeWordIdx = j;
                }
                cumulativeTime += wordDuration;
            }
        }

        if (activeWordIdx !== current_word_index) {
            current_word_index = activeWordIdx;
            const lineElem = document.getElementById(`line-${targetIndex}`);
            if (lineElem) {
                const wordSpans = lineElem.querySelectorAll('.word');
                wordSpans.forEach((w, i) => {
                    w.classList.toggle('active-word', i <= activeWordIdx);
                });
            }
        }
    }
}

function fetchMetadata() {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2500);

    fetch(metadataUrl, { signal: controller.signal })
        .then(res => {
            clearTimeout(timeoutId);
            if (!res.ok) throw new Error("Metadata response error");
            return res.json();
        })
        .then(data => {
            if (data && data.start_time) {
                const clientNow = Date.now() / 1000;
                
                if (data.server_time || data.timestamp) {
                    const serverNow = data.server_time || data.timestamp;
                    const newOffset = serverNow - clientNow;
                    if (clockOffset === 0) {
                        clockOffset = newOffset;
                    } else {
                        clockOffset = clockOffset * 0.8 + newOffset * 0.2;
                    }
                }

                if (hls && !isNaN(hls.latency) && hls.latency > 0) {
                    smoothedLatency = smoothedLatency * 0.7 + hls.latency * 0.3;
                }

                const trackKey = `${data.artist}-${data.title}-${data.start_time}`;
                const incomingTrack = {
                    key: trackKey,
                    title: data.title || 'Stream',
                    artist: data.artist || 'Jakpat Radio',
                    album: (data.album && data.album !== 'Unknown') ? data.album : '',
                    cover: data.cover_url || data.cover || data.art || null,
                    duration: Math.round(data.duration || 0),
                    startTime: data.start_time
                };
                
                if (!activeTrack) {
                    applyTrackMetadata(incomingTrack);
                } else if (!metadataQueue.some(t => t.key === trackKey) && activeTrack.key !== trackKey) {
                    metadataQueue.push(incomingTrack);
                }
            }
        })
        .catch(() => {
            clearTimeout(timeoutId);
        });
}

async function applyTrackMetadata(track) {
    activeTrack = track;
    current_line_index = -1;
    current_word_index = -1;
    current_lyrics = [];
    lastSongPos = 0;

    songTitleElem.innerText = track.title;
    artistNameElem.innerText = track.artist;
    if (!isReconnecting) {
        albumNameElem.innerText = track.album || 'Jakpat Radio Stream';
    }

    if (track.duration > 0) {
        totalDurationElem.innerText = formatTime(track.duration);
    }

    if (track.artist !== 'Jakpat Radio') {
        const resolvedArt = await resolveArtwork(track.artist, track.title, track.cover);
        updateArtwork(resolvedArt);
        updateMediaSession(track.title, track.artist, track.album, resolvedArt);
        getLyrics(track.title, track.artist, track.duration);
    } else {
        updateArtwork(defaultArtwork);
        updateMediaSession(track.title, track.artist, track.album, defaultArtwork);
        setStatus("Waiting for music...");
    }
}

function getAudioServerTime() {
    const clientNow = Date.now() / 1000;
    const currentServerTime = clientNow + clockOffset;
    return currentServerTime - smoothedLatency;
}

function mainAnimationLoop() {
    if (!audio.paused) {
        const audioServerTime = getAudioServerTime();

        if (metadataQueue.length > 0) {
            const nextTrack = metadataQueue[0];
            if (audioServerTime >= nextTrack.startTime) {
                applyTrackMetadata(nextTrack);
                metadataQueue.shift();
            }
        }

        if (activeTrack) {
            const rawPos = Math.max(0, audioServerTime - activeTrack.startTime);

            if (rawPos < lastSongPos - 1.5) {
                lastSongPos = rawPos;
            } else {
                lastSongPos = Math.max(lastSongPos, rawPos);
            }

            const current_song_pos = lastSongPos;

            if (activeTrack.duration > 0) {
                const formattedCur = formatTime(Math.floor(current_song_pos));
                if (formattedCur !== lastFormattedTime) {
                    currentTimeElem.innerText = formattedCur;
                    totalDurationElem.innerText = formatTime(activeTrack.duration);
                    lastFormattedTime = formattedCur;
                }
                const percent = Math.min((current_song_pos / activeTrack.duration) * 100, 100);
                document.documentElement.style.setProperty('--progress-percent', `${percent}%`);
            }

            updateLyricsPosition(current_song_pos);
        }
    }
    requestAnimationFrame(mainAnimationLoop);
}

function updateArtwork(imgUrl) {
    albumArt.src = imgUrl;
    ambientBg.style.backgroundImage = `url('${imgUrl}')`;
}

function scheduleReconnect() {
    if (isReconnecting) return;
    isReconnecting = true;
    stopMetadataPolling();

    liveBadge.classList.add('reconnecting');
    liveStatusText.innerText = "RECONNECTING";
    albumNameElem.innerText = "Server offline. Retrying connection...";

    if (hls) {
        try { hls.destroy(); } catch(e) {}
        hls = null;
    }
    audio.pause();
    audio.removeAttribute('src');
    audio.load();

    if (reconnectTimer) clearInterval(reconnectTimer);

    reconnectTimer = setInterval(() => {
        setupStreamSource(true);
    }, 2000);
}

function setupStreamSource(isRetry = false) {
    if (Hls.isSupported()) {
        if (hls) {
            try { hls.destroy(); } catch(e) {}
        }

        hls = new Hls({
            liveSyncDurationCount: 3,         
            liveMaxLatencyDurationCount: 8,   
            maxBufferLength: 30,              
            maxMaxBufferLength: 60,          
            enableWorker: true,
            lowLatencyMode: false,
            manifestLoadingTimeOut: 2500,
            manifestLoadingMaxRetry: 1,
            fragLoadingTimeOut: 2500,
            fragLoadingMaxRetry: 1,
            levelLoadingTimeOut: 2500,
            levelLoadingMaxRetry: 1
        });
        
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (isReconnecting) {
                clearInterval(reconnectTimer);
                reconnectTimer = null;
                isReconnecting = false;
                
                liveBadge.classList.remove('reconnecting');
                liveStatusText.innerText = "LIVE";
                albumNameElem.innerText = activeTrack ? (activeTrack.album || 'Jakpat Radio Stream') : 'Live Stream';
            }

            if (shouldBePlaying) {
                hls.startLoad(-1);
                audio.play().catch(() => {});
            }
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                scheduleReconnect();
            }
        });
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = streamUrl;
        if (isRetry || shouldBePlaying) {
            audio.load();
            if (shouldBePlaying) audio.play().catch(() => {});
        }
    }
}

function togglePlay() {
    if (audio.paused) {
        shouldBePlaying = true;
        fetchMetadata();
        
        if (isReconnecting) {
            setupStreamSource(true);
            return;
        }
        if (hls) hls.startLoad(-1);
        audio.play().catch(err => {
            console.warn("Playback blocked or failed:", err);
        });
    } else {
        shouldBePlaying = false;
        audio.pause();
        if (hls) hls.stopLoad();
    }
}

function startStallWatchdog() {
    if (stallCheckTimer) clearInterval(stallCheckTimer);
    stallCheckTimer = setInterval(() => {
        if (shouldBePlaying && !isReconnecting) {
            if (audio.currentTime === lastProgressTime && !audio.paused && audio.readyState < 3) {
                scheduleReconnect();
            }
            lastProgressTime = audio.currentTime;
        }
    }, 3000);
}

function initPlayer() {
    audio.volume = 0.8;
    fetchMetadata();
    setupStreamSource();
    initMediaSession();
    startStallWatchdog();

    audio.addEventListener('play', () => {
        shouldBePlaying = true;
        playBtn.classList.add('playing');
        playBtn.setAttribute('aria-label', 'Pause Stream');
        playIcon.querySelector('path').setAttribute('d', "M14,19H18V5H14M6,19H10V5H6V19Z");
        if ('mediaSession' in navigator) {
            navigator.mediaSession.playbackState = 'playing';
        }
        startMetadataPolling();
    });

    audio.addEventListener('pause', () => {
        if (!isReconnecting) shouldBePlaying = false;
        playBtn.classList.remove('playing');
        playBtn.setAttribute('aria-label', 'Play Stream');
        playIcon.querySelector('path').setAttribute('d', "M8,5.14V19.14L19,12.14L8,5.14Z");
        if ('mediaSession' in navigator) {
            navigator.mediaSession.playbackState = 'paused';
        }
        stopMetadataPolling();
    });

    audio.addEventListener('error', () => {
        if (shouldBePlaying) scheduleReconnect();
    });

    if (!audio.paused && !document.hidden) {
        startMetadataPolling();
    }

    requestAnimationFrame(mainAnimationLoop);
}

playBtn.addEventListener('click', togglePlay);

volumeSlider.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    audio.volume = val;
    if (val > 0) lastVolume = val;
    document.documentElement.style.setProperty('--volume-percent', `${val * 100}%`);
});

volumeToggle.addEventListener('click', () => {
    if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
    } else {
        audio.volume = lastVolume > 0 ? lastVolume : 0.8;
        volumeSlider.value = audio.volume;
    }
    document.documentElement.style.setProperty('--volume-percent', `${volumeSlider.value * 100}%`);
});

window.addEventListener('DOMContentLoaded', initPlayer);
</script>
